[project]
name = "brain-mri-segmentation"
version = "1.0.0"
description = "LGG brain MRI tumour segmentation: does adding batch-pooled soft Dice to BCE help? (ML Project 1)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B023", "UP015"]

[tool.pytest.ini_options]
testpaths = ["tests"]
